<!DOCTYPE html><html lang="fa"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#7236fe"><link rel="manifest" href="manifest.json"><link rel="icon" href="../../assets/favicon.png"><link rel="apple-touch-icon" href="../../assets/icon-192.png"><title>CUDER DownFlow</title>
<style>
:root{--bg:#0a0812;--pn:#110e20;--pn2:#181430;--bd:#2a2150;--tx:#f3f0ff;--mu:#9a93bd;--pr:#7236fe;--ok:#34d399;--no:#f87171;--hv:#ffffff12}
body.light{--bg:#f4f2fb;--pn:#fff;--pn2:#ece9f7;--bd:#cfc8e8;--tx:#1b1535;--mu:#6b6590;--hv:#00000010}
*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font:13px Tahoma,"Segoe UI",sans-serif;user-select:none;overflow:hidden}
#mb{display:flex;background:var(--pn);border-bottom:1px solid var(--bd);padding:0 6px}#mb span{padding:6px 12px;cursor:pointer}#mb span:hover{background:var(--hv)}
#tbar{display:flex;gap:2px;padding:6px 8px;background:var(--pn);border-bottom:1px solid var(--bd);overflow-x:auto}
.tb{background:none;border:0;color:var(--tx);cursor:pointer;padding:5px 10px;border-radius:8px;min-width:62px;font:inherit;transition:.15s}.tb:hover{background:var(--hv)}.tb i{display:block;font-style:normal;font-size:22px}
#main{flex:1;display:flex;min-height:0}#tree{width:200px;background:var(--pn);border-inline-end:1px solid var(--bd);overflow:auto;padding:6px 0;direction:rtl}
.tn{padding:4px 10px;cursor:pointer;display:flex;gap:4px;align-items:center}.tn:hover{background:var(--hv)}.tn.on{background:var(--pr);color:#fff}.tn small{margin-inline-start:auto;opacity:.7}.th{padding:8px 10px 2px;color:var(--mu);font-size:11px}
#cw{flex:1;display:flex;flex-direction:column;min-width:0}#sr{display:none;gap:6px;padding:6px;background:var(--pn);border-bottom:1px solid var(--bd)}#tw{flex:1;overflow:auto}
table{border-collapse:collapse;width:100%;direction:rtl}th{position:sticky;top:0;background:var(--pn2);padding:5px 8px;text-align:start;border:1px solid var(--bd);font-weight:600;white-space:nowrap}td{padding:3px 8px;border-bottom:1px solid var(--bd);white-space:nowrap;max-width:420px;overflow:hidden;text-overflow:ellipsis;unicode-bidi:plaintext}
tr.r:hover{background:var(--hv)}tr.on{background:color-mix(in srgb,var(--pr) 45%,transparent)}.ic{margin-inline-end:6px}.mb{display:inline-block;width:60px;height:6px;background:var(--pn2);border-radius:9px;margin-inline-start:6px;vertical-align:middle;overflow:hidden}.mb i{display:block;height:100%;background:linear-gradient(90deg,#7236fe,#c026d3)}.no{color:var(--no)}.ok{color:var(--ok)}
#sb{display:flex;gap:18px;padding:3px 10px;background:var(--pn);border-top:1px solid var(--bd);color:var(--mu)}
#cm{position:fixed;display:none;background:var(--pn);border:1px solid var(--bd);border-radius:8px;padding:4px;min-width:220px;z-index:50;box-shadow:0 10px 30px #0008}#cm div{padding:5px 14px;border-radius:5px;cursor:pointer}#cm div:hover{background:var(--pr);color:#fff}#cm hr{border:0;border-top:1px solid var(--bd);margin:3px 0}#cm div.dis{opacity:.45;pointer-events:none}
#ov{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:60}.dlg{background:var(--pn);border:1px solid var(--bd);border-radius:10px;max-width:96vw;max-height:92vh;display:flex;flex-direction:column;direction:rtl}.dt{padding:9px 14px;border-bottom:1px solid var(--bd);font-weight:600;display:flex;justify-content:space-between}.dt .x{cursor:pointer}.db{padding:14px;overflow:auto}.df{padding:10px 14px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-start}
.db label{display:block;margin:7px 0;color:var(--tx)}.db input:not([type=checkbox]):not([type=radio]),.db select{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:6px 8px;color:var(--tx);font:inherit;user-select:text;margin-top:3px}.db .ck{display:flex;gap:6px;align-items:center}.db fieldset{border:1px solid var(--bd);border-radius:8px;margin:8px 0}.mu{color:var(--mu)}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.b{background:var(--pr);color:#fff;border:0;border-radius:7px;padding:6px 18px;cursor:pointer;font:inherit}.b.o{background:none;border:1px solid var(--bd);color:var(--tx)}.b:hover{filter:brightness(1.15)}
.tabs{display:flex;flex-wrap:wrap;gap:2px;border-bottom:1px solid var(--bd);margin-bottom:10px}.tabs span{padding:6px 12px;cursor:pointer;border-radius:7px 7px 0 0}.tabs span.on{background:var(--pr);color:#fff}.pnl{display:none}.pnl.on{display:block}
.sg{display:grid;grid-template-columns:180px 1fr;gap:12px}.sl{border:1px solid var(--bd);border-radius:8px;padding:4px;min-height:260px}.lt{width:100%;font-size:12px}.lt td{border:0;padding:2px}.lt input{margin:0!important}
#toast{position:fixed;bottom:34px;left:50%;transform:translateX(-50%);background:var(--pn2);border:1px solid var(--pr);padding:6px 16px;border-radius:99px;display:none;z-index:80}
body.th{--pn:color-mix(in srgb,var(--pr) 8%,var(--bg));--pn2:color-mix(in srgb,var(--pr) 14%,var(--bg));--bd:color-mix(in srgb,var(--pr) 30%,var(--bg));--mu:color-mix(in srgb,var(--tx) 62%,var(--bg))}
#brand{display:flex;align-items:center;gap:14px;padding:6px 12px;background:linear-gradient(90deg,color-mix(in srgb,var(--pr) 35%,var(--bg)),var(--pn));border-bottom:1px solid var(--bd)}#brand a{color:var(--tx);text-decoration:none}#brand .lg{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.12em}#brand .lg img{width:24px;height:24px}#brand .lg i{font-style:normal;color:#c4b0ff;letter-spacing:.02em}#brand .sp{flex:1}#brand .pb{background:var(--pr);color:#fff!important;padding:3px 14px;border-radius:99px;font-size:12px}
label:has([data-q="open"]),label:has([data-q="boot"]),label:has([data-q="force"]){display:none!important}
@media(max-width:700px){#tree{display:none}#brand .hide{display:none}.tb{min-width:48px;padding:4px 6px;font-size:11px}}
</style></head><body>
<div id="brand"><a class="lg" href="../index.html"><img src="../../assets/logo.svg" alt="">CUDER <i>DownFlow</i></a><span class="sp"></span><a class="pb" href="../../account.html">ثبت‌نام: Pro تا ۴ ماه رایگان</a><a class="hide" href="../../index.html">CUDER</a><a class="hide" href="../features.html">امکانات</a></div><div id="mb"></div><div id="tbar"></div>
<div id="main"><div id="tree"></div><div id="cw"><div id="sr"><input id="sq" placeholder="جستجو…" style="flex:1;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:4px 8px"><button class="b o" id="sx">✕</button></div><div id="tw"><table id="tb"></table></div></div></div>
<div id="sb"><span id="s1"></span><span id="s2"></span><span id="s3"></span></div><div id="cm"></div><div id="ov"></div><div id="toast"></div>
<script>window.WEB=true;if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){})</script><script src="webshim.js"></script><script src="renderer.js"></script></body></html>
