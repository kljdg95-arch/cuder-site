<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CUDER | مدیریت کسب‌وکار</title>
<style>
:root{color-scheme:dark;--bg:#07060d;--cd:#110e20;--tx:#f3f0ff;--mu:#9a93bd;--pr:#8b5cf6;--pr2:#c026d3;--bd:#261f42;--ok:#34d399;--no:#f87171;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;line-height:1.7;padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#0b0814;z-index:10}
header{padding:16px 16px 4px;display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.12em}
header svg{width:28px;height:28px}
main{max-width:640px;margin:auto;padding:8px 14px}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st b{display:block;font-size:1.25rem}.st span{color:var(--mu);font-size:.8rem}
.ok{color:var(--ok)}.no{color:var(--no)}
h2{font-size:1.1rem;margin:14px 0 4px}
input,select,textarea,button{font:inherit;color:var(--tx)}
input,select,textarea{width:100%;background:#0c0916;border:1px solid var(--bd);border-radius:10px;padding:10px;margin:4px 0}
.btn{background:linear-gradient(135deg,var(--pr),var(--pr2));border:0;border-radius:10px;padding:10px 18px;font-weight:600;cursor:pointer;margin-top:4px}
.sm{background:none;border:1px solid var(--bd);border-radius:8px;padding:2px 10px;cursor:pointer;color:var(--mu)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mu{color:var(--mu);font-size:.82rem}
.badge{font-size:.72rem;padding:1px 8px;border-radius:99px;border:1px solid}
nav{position:fixed;inset:auto 0 0;background:#0b0814f2;backdrop-filter:blur(10px);border-top:1px solid var(--bd);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;color:var(--mu);font-size:.72rem;padding:4px;cursor:pointer}
nav button.on{color:#c4b0ff}nav i{display:block;font-style:normal;font-size:1.3rem}
section{display:none}section.on{display:block}
.empty{color:var(--mu);text-align:center;padding:18px}
</style>
</head>
<body>
<header><svg viewBox="0 0 32 32"><defs><linearGradient id="l" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#c026d3"/></linearGradient></defs><path d="M16 2l12 7v14l-12 7L4 23V9z" fill="url(#l)"/><path d="M20 12.5a5 5 0 100 7" stroke="#07060d" stroke-width="3" fill="none" stroke-linecap="round"/></svg>CUDER</header>
<main>
<section id="home" class="on">
<div class="g"><div class="cd st"><b class="ok" id="sI">۰</b><span>درآمد (تومان)</span></div><div class="cd st"><b class="no" id="sE">۰</b><span>هزینه (تومان)</span></div>
<div class="cd st"><b id="sB">۰</b><span>موجودی خالص</span></div><div class="cd st"><b class="no" id="sD">۰</b><span>طلب از مشتری‌ها</span></div></div>
<h2>پیگیری‌های امروز</h2><div id="fu"></div>
</section>

<section id="cus"><h2>مشتری جدید</h2><div class="cd"><input id="cn" placeholder="نام مشتری"><input id="cp" placeholder="شماره تماس"><button class="btn" id="ca">افزودن مشتری</button></div>
<h2>مشتری‌ها</h2><div id="cl"></div></section>

<section id="inv"><h2>فاکتور جدید</h2><div class="cd"><select id="ic"></select>
<textarea id="il" rows="3" placeholder="هر خط یک ردیف:&#10;طراحی لوگو | 2000000&#10;هاست | 500000"></textarea>
<button class="btn" id="ia">صدور فاکتور</button></div><h2>فاکتورها</h2><div id="ilist"></div></section>

<section id="mon"><h2>ثبت درآمد یا هزینه</h2><div class="cd"><select id="mt"><option value="in">درآمد</option><option value="out">هزینه</option></select>
<input id="mn" placeholder="عنوان"><input id="ma" inputmode="numeric" placeholder="مبلغ (تومان)"><button class="btn" id="mb">ثبت</button></div>
<h2>تراکنش‌ها</h2><div id="ml"></div></section>
</main>
<nav id="nv"><button data-t="home" class="on"><i>📊</i>خانه</button><button data-t="cus"><i>👥</i>مشتری‌ها</button><button data-t="inv"><i>🧾</i>فاکتورها</button><button data-t="mon"><i>💰</i>مالی</button></nav>
<script>
var $=function(i){return document.getElementById(i)};
var S={c:[],i:[],t:[]};
try{var r=localStorage.getItem("cuder");if(r)S=JSON.parse(r)}catch(e){}
function save(){try{localStorage.setItem("cuder",JSON.stringify(S))}catch(e){}}
function fa(n){return Number(n||0).toLocaleString("fa-IR")}
function toJ(gy,gm,gd){var m=[0,31,59,90,120,151,181,212,243,273,304,334],g=gm>2?gy+1:gy,d=355666+365*gy+Math.floor((g+3)/4)-Math.floor((g+99)/100)+Math.floor((g+399)/400)+gd+m[gm-1],jy=-1595+33*Math.floor(d/12053);d%=12053;jy+=4*Math.floor(d/1461);d%=1461;if(d>365){jy+=Math.floor((d-1)/365);d=(d-1)%365}var jm=d<186?1+Math.floor(d/31):7+Math.floor((d-186)/30),jd=1+(d<186?d%31:(d-186)%30);return jy+"/"+jm+"/"+jd}
function today(){var n=new Date();return fa(toJ(n.getFullYear(),n.getMonth()+1,n.getDate())).replace(/٬/g,"")}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function cname(id){var c=S.c.filter(function(x){return x.id==id})[0];return c?c.name:"—"}
function tot(f){return f.l.reduce(function(a,b){return a+b.a},0)}
function render(){
 var inc=S.t.filter(function(x){return x.k=="in"}).reduce(function(a,b){return a+b.a},0)+S.i.filter(function(f){return f.p}).reduce(function(a,f){return a+tot(f)},0);
 var exp=S.t.filter(function(x){return x.k=="out"}).reduce(function(a,b){return a+b.a},0);
 var due=S.i.filter(function(f){return !f.p}).reduce(function(a,f){return a+tot(f)},0);
 $("sI").textContent=fa(inc);$("sE").textContent=fa(exp);$("sB").textContent=fa(inc-exp);$("sD").textContent=fa(due);
 var un=S.i.filter(function(f){return !f.p});
 $("fu").innerHTML=un.length?un.map(function(f){return '<div class="cd row"><div>'+esc(cname(f.c))+'<div class="mu">فاکتور '+fa(f.n)+' · '+f.d+'</div></div><b class="no">'+fa(tot(f))+'</b></div>'}).join(""):'<div class="empty">پیگیری باز نداری 🎉</div>';
 $("cl").innerHTML=S.c.length?S.c.map(function(c){return '<div class="cd row"><div>'+esc(c.name)+'<div class="mu">'+esc(c.ph||"")+'</div></div><button class="sm" data-dc="'+c.id+'">حذف</button></div>'}).join(""):'<div class="empty">هنوز مشتری‌ای ثبت نشده</div>';
 $("ic").innerHTML=S.c.length?S.c.map(function(c){return '<option value="'+c.id+'">'+esc(c.name)+'</option>'}).join(""):'<option value="">اول یک مشتری اضافه کن</option>';
 $("ilist").innerHTML=S.i.length?S.i.slice().reverse().map(function(f){return '<div class="cd"><div class="row"><b>فاکتور '+fa(f.n)+' · '+esc(cname(f.c))+'</b><span class="badge '+(f.p?"ok":"no")+'">'+(f.p?"پرداخت‌شده":"پرداخت‌نشده")+'</span></div>'+f.l.map(function(x){return '<div class="row mu"><span>'+esc(x.t)+'</span><span>'+fa(x.a)+'</span></div>'}).join("")+'<div class="row" style="margin-top:6px"><b>جمع: '+fa(tot(f))+' تومان</b><span><button class="sm" data-pf="'+f.n+'">'+(f.p?"لغو پرداخت":"پرداخت شد")+'</button> <button class="sm" data-df="'+f.n+'">حذف</button></span></div><div class="mu">'+f.d+'</div></div>'}).join(""):'<div class="empty">هنوز فاکتوری صادر نشده</div>';
 $("ml").innerHTML=S.t.length?S.t.slice().reverse().map(function(x){return '<div class="cd row"><div>'+esc(x.t)+'<div class="mu">'+x.d+'</div></div><span><b class="'+(x.k=="in"?"ok":"no")+'">'+(x.k=="in"?"+":"−")+fa(x.a)+'</b> <button class="sm" data-dt="'+x.id+'">×</button></span></div>'}).join(""):'<div class="empty">تراکنشی ثبت نشده</div>';
}
function num(s){return Number(String(s).replace(/[۰-۹]/g,function(d){return "۰۱۲۳۴۵۶۷۸۹".indexOf(d)}).replace(/[^\d]/g,""))||0}
$("ca").onclick=function(){var n=$("cn").value.trim();if(!n)return;S.c.push({id:Date.now(),name:n,ph:$("cp").value.trim()});$("cn").value=$("cp").value="";save();render()};
$("ia").onclick=function(){var c=$("ic").value;if(!c)return;var l=$("il").value.split("\n").map(function(s){var p=s.split("|");return{t:(p[0]||"").trim(),a:num(p[1])}}).filter(function(x){return x.t&&x.a});if(!l.length){alert("هر خط را به شکل «عنوان | مبلغ» بنویس");return}
 S.i.push({n:(S.i.reduce(function(m,f){return Math.max(m,f.n)},1000)+1),c:c,l:l,p:false,d:today()});$("il").value="";save();render()};
$("mb").onclick=function(){var a=num($("ma").value),t=$("mn").value.trim();if(!a||!t)return;S.t.push({id:Date.now(),k:$("mt").value,t:t,a:a,d:today()});$("mn").value=$("ma").value="";save();render()};
document.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;var d=b.dataset;
 if(d.t){document.querySelectorAll("section").forEach(function(s){s.classList.toggle("on",s.id==d.t)});document.querySelectorAll("nav button").forEach(function(x){x.classList.toggle("on",x==b)});window.scrollTo(0,0)}
 if(d.dc){S.c=S.c.filter(function(c){return c.id!=d.dc});save();render()}
 if(d.pf){S.i.forEach(function(f){if(f.n==d.pf)f.p=!f.p});save();render()}
 if(d.df){S.i=S.i.filter(function(f){return f.n!=d.df});save();render()}
 if(d.dt){S.t=S.t.filter(function(x){return x.id!=d.dt});save();render()}});
render();
</script>
</body>
</html>
